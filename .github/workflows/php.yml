name: CI

on:
    push:
        branches: [ main, develop ]
        tags: [ '*' ]
    pull_request:
        branches: [ main, develop ]

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: apcu
                  ini-values: apc.enable_cli=1
                  coverage: pcov

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-

            # Resolve dependencies per PHP version rather than installing the committed
            # lock, whose PHPUnit pin does not satisfy every supported PHP version.
            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            - name: Run PHPStan static analysis
              run: composer run-script phpstan

            - name: Run test suite
              run: composer run-script test

            - name: Report coverage
              if: matrix.php == '8.4'
              run: vendor/bin/phpunit -c . --coverage-text --coverage-clover=coverage.xml

            - name: Upload coverage to Codecov
              if: matrix.php == '8.4'
              uses: codecov/codecov-action@v4
              with:
                  files: coverage.xml
                  fail_ci_if_error: false
              continue-on-error: true

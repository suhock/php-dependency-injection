name: CI

on:
    push:
        branches: [ main, develop ]
        tags: [ '*' ]
    pull_request:
        branches: [ main, develop ]

permissions:
    contents: read

jobs:
    test:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: [ '8.1', '8.2', '8.3', '8.4', '8.5' ]

        steps:
            - uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: apcu
                  ini-values: apc.enable_cli=1
                  coverage: pcov

            - name: Validate composer.json
              run: composer validate --strict

            - name: Cache Composer packages
              uses: actions/cache@v5
              with:
                  path: vendor
                  key: ${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
                  restore-keys: |
                      ${{ runner.os }}-php${{ matrix.php }}-

            # Resolve dependencies and select a PHPUnit version per PHP version.
            - name: Install dependencies
              run: composer update --prefer-dist --no-progress

            # Skipped on 8.1: a DNF test fixture needs 8.2+ grammar to parse, and PHPUnit 10.5 (the only line that
            # supports 8.1) declares matcher methods like once() static, which trips the strict rules. Static analysis
            # on 8.2+ covers the code; 8.1 runtime support is covered by the test suite.
            - name: Run PHPStan static analysis
              if: matrix.php != '8.1'
              run: composer run-script phpstan

            - name: Run test suite
              run: composer run-script test

            - name: Report coverage
              if: matrix.php == '8.5'
              run: vendor/bin/phpunit -c . --coverage-text --coverage-clover=coverage.xml

            - name: Upload coverage to Codecov
              if: matrix.php == '8.5'
              uses: codecov/codecov-action@v5
              with:
                  files: coverage.xml
                  fail_ci_if_error: false
              continue-on-error: true
